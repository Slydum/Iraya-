name: Cancel stale Pages deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-pages.yml"

permissions:
  contents: read
  pages: write

jobs:
  cancel:
    name: Cancel stuck Pages deployment
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT: d0a51b882ff8095612336f0aa2f5d2b1a1320486
        run: |
          response="$(mktemp)"
          status="$(curl -sS -L -o "$response" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT}/cancel")"

          cat "$response"
          echo "Cancel endpoint returned HTTP $status"

          case "$status" in
            202|204|404|409)
              echo "The stale deployment is cleared or no longer active."
              ;;
            *)
              exit 1
              ;;
          esac

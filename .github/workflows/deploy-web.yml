name: Build and publish Iraya web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phaser app
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate asset-vault importer
        run: python3 -m py_compile tools/import_modern_farm.py

      - name: Materialize verified legacy runtime images
        run: node tools/materialize_runtime_assets.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Give the Modern Farm build a stable cache key
        run: |
          js_path="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          test -n "$js_path"
          js_name="$(basename "$js_path")"
          versioned_js="index-modern-farm-mf-iraya-1.js"

          grep -q 'assets/farm_world.webp?v=8e20d0c4' "$js_path"
          grep -q 'mf-iraya-1' "$js_path"
          mv "$js_path" "dist/assets/$versioned_js"
          sed -i "s|assets/$js_name|assets/$versioned_js|g" dist/index.html

      - name: Verify production output
        run: |
          test -s dist/index.html
          test -s dist/assets/farm_world.webp
          test -s dist/assets/farmer_1.png
          test -s dist/assets/runtime-manifest.json
          test -s dist/assets/modern-farm/runtime-manifest.json
          test -s dist/manifest.webmanifest
          test -s dist/assets/index-modern-farm-mf-iraya-1.js
          grep -q 'assets/index-modern-farm-mf-iraya-1.js' dist/index.html
          grep -q 'assets/index-.*\.css' dist/index.html
          grep -q 'iraya-modern-farm.webp' dist/assets/index-modern-farm-mf-iraya-1.js
          grep -q 'iraya-modern-farm.json' dist/assets/index-modern-farm-mf-iraya-1.js
          grep -q 'mf-iraya-1' dist/assets/index-modern-farm-mf-iraya-1.js
          grep -q '"orientation": "portrait-primary"' dist/manifest.webmanifest
          ! grep -q '/src/main.ts' dist/index.html

          test "$(wc -c < dist/assets/farmer_1.png | tr -d ' ')" = "7967"
          test "$(wc -c < dist/assets/farm_world.webp | tr -d ' ')" = "11796"
          echo '0cc99b2b727e7487ae7de1c6390fed5120182d030cc53f3f88b4f6a0e2bd84cc  dist/assets/farmer_1.png' | sha256sum --check --strict
          echo '8e20d0c43e3eef8c84a7f4ae4738fcc50355d7ae749deae0e35e07014357b3fd  dist/assets/farm_world.webp' | sha256sum --check --strict

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('dist/assets/modern-farm/runtime-manifest.json').read_text())
          for asset in manifest['assets']:
              path = Path('dist') / asset['path']
              assert path.is_file() and path.stat().st_size == asset['bytes'], path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == asset['sha256'], f'{path}: {digest}'
          print(f"Verified {len(manifest['assets'])} curated Modern Farm exports.")
          PY

          file dist/assets/farmer_1.png | grep -q 'PNG image data, 336 x 256'
          file dist/assets/farm_world.webp | grep -q 'Web/P image'
          file dist/assets/modern-farm/iraya-modern-farm.webp | grep -q 'Web/P image'
          python3 -m json.tool dist/assets/modern-farm/iraya-modern-farm.json >/dev/null

      - name: Publish production files to branch root
        if: github.event_name == 'push'
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
          cp dist/icon.svg icon.svg
          cp dist/manifest.webmanifest manifest.webmanifest
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets icon.svg manifest.webmanifest .nojekyll

          if git diff --cached --quiet; then
            echo "Production files are already current."
          else
            git commit -m "Publish Modern Farm Phaser integration [skip ci]"
            git push origin HEAD:main
          fi
